<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 165" width="165" height="165" role="img" aria-labelledby="t d"><title id="t">Win-rate ring, fictional PlayerOne fixture</title><desc id="d">27 wins out of 48 matches, equal to 56.25 percent. Both rings use an 11px stroke. Demonstration only.</desc><circle cx="82.5" cy="82.5" r="60" fill="none" stroke="#304638" stroke-width="11"/><circle cx="82.5" cy="82.5" r="60" fill="none" stroke="#86f4a4" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="56.25 100" transform="rotate(-90 82.5 82.5)"/><text x="82.5" y="87" fill="#f2f9f2" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">56.3%</text><text x="82.5" y="107" fill="#b4c7b6" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">27 / 48 WINS</text></svg>
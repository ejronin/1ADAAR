<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" role="img" aria-labelledby="t d"><title id="t">Hero path motion overlay</title><desc id="d">Two-pixel trace follows a rounded hero rectangle; does not include or alter the official 1AD logo.</desc><rect x="3" y="3" width="494" height="144" rx="13" fill="#102118" stroke="#315f42" stroke-width="1"/><rect x="3" y="3" width="494" height="144" rx="13" fill="none" stroke="#94f7af" stroke-width="2" pathLength="100" stroke-dasharray="19 81" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.45s" fill="freeze" repeatCount="1"/></rect><text x="30" y="80" fill="#e3f8e7" font-family="Arial,sans-serif" font-size="15">Original art remains in docs/assets/</text></svg>
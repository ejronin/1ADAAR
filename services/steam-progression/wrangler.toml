name = "1adaar-steam-progression"
main = "worker.mjs"
compatibility_date = "2026-10-22"
workers_dev = true

[vars]
PUBLIC_PAGE_URL = "https://ejronin.github.io/1ADAAR/players.html"
PUBLIC_PROGRESSION_URL = "https://ejronin.github.io/1ADAAR/progression.html"
PUBLIC_ORIGIN = "https://ejronin.github.io"
# Fill with the actual HTTPS Worker hostname after initial deployment.
AUTH_ORIGIN = "https://REPLACE-WITH-YOUR-WORKER.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "1adaar-steam-consent"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_UUID"

name: Publish Sunday weekly intelligence
on:
  push:
    branches: [main]
    paths:
      - 'src/weekly_publish.py'
      - 'src/weekly_card.py'
      - '.github/workflows/weekly.yml'
  schedule:
    # Noon Eastern changes UTC offset for daylight saving; run both hours,
    # and let the Python timezone gate refuse any premature publication.
    - cron: '7,37 16,17 * * 0'
    # Catch missed Sunday runs or safely retry when no delivery was confirmed.
    - cron: '17 17 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Weekly delivery and the ordinary WARCON collector both write to main.
  # Serial execution prevents a duplicated post from stale checkout state.
  group: 1adaar-collector
  cancel-in-progress: false
jobs:
  weekly:
    if: github.repository == 'ejronin/1ADAAR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install weekly card renderer
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Verify weekly reporting and idempotence
        run: python -m unittest discover -s tests -p 'test_weekly_publish.py' -v
      - name: Generate map art for recorded-match award cards
        run: python scripts/build_map_banners.py
      - name: Send weekly roundup and require Discord acknowledgement
        env:
          DISCORD_MATCH_WEBHOOK: ${{ secrets.DISCORD_MATCH_WEBHOOK }}
        run: python -m src.weekly_publish
      - name: Save confirmed weekly delivery and archive
        run: |
          git config user.name "1adaar-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/weekly/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish weekly intelligence and confirmed delivery"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
      - name: Deploy archived weekly results
        uses: actions/deploy-pages@v5

name: Staging player UX screenshots (six widths)
on:
  pull_request:
    paths:
      - 'docs/players.html'
      - 'docs/playerone-demo.html'
      - 'docs/js/**'
      - 'docs/assets/**'
      - 'tests/visual_review.py'
      - 'src/recap_card.py'
      - 'src/discord_layout.py'
      - '.github/workflows/v11-player-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    if: github.repository == 'ejronin/1ADAAR' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Chromium for actual browser screenshots
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0 CairoSVG==2.8.2
          python -m playwright install --with-deps chromium
      - name: Capture and test 320 / 375 / 390 / 768 / 1024 / 1440px
        run: python tests/visual_review.py
      - name: Preserve review screenshots even on QA failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1ADAAR-v1.1.0-player-ux-screenshots
          path: visual-review/
          if-no-files-found: warn
          retention-days: 30

name: Validate code and publication safety
on:
  pull_request:
    branches: [main, staging/v2.0-foundation]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned image renderer
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python compilation
        run: python -m compileall -q src
      - name: JavaScript syntax validation
        run: |
          node --check docs/js/app.js
          node --check docs/js/home-intelligence.js
          node --check docs/js/activity-insights.js
          node --check docs/js/activity.js
          node tests/activity_insights.test.cjs
          node --check docs/js/match-sort.js
          node tests/match-sort.test.cjs
          node tests/archive_ui.test.cjs
          node --check docs/js/players.js
          node --check docs/js/performance-core.js
          node --check docs/js/performance.js
          node --check docs/js/progression.js
          node --check docs/js/progression-config.js
          node --check services/steam-progression/worker.mjs
          node --test tests/progression_auth.test.mjs
          node --test tests/progression_auth_e2e.test.mjs
          node --check docs/js/role-radar.js
          node --check docs/js/demo-progression.js
          node --check docs/js/demo-performance.js
          node --check docs/js/factions.js
          node tests/factions.test.cjs
          node --check docs/js/server-status.js
          node tests/server_status.test.cjs
          node tests/performance.test.cjs
          node tests/performance_dom.test.cjs
          node tests/demo_performance.test.cjs
          node --check docs/js/share.js
          node --check docs/js/demo-share.js
          node tests/share_browser.test.cjs
      - name: No secrets in public snapshot
        run: |
          python - <<'PY'
          import pathlib,re
          public=pathlib.Path('docs')
          for path in public.rglob('*'):
            if not path.is_file() or path.suffix not in {'.html','.js','.css','.json','.svg','.txt'}: continue
            txt=path.read_text(encoding='utf-8')
            assert not re.search(r'(?:wkf|wck)_[A-Za-z0-9_-]{15,}',txt),path
            assert 'discord.com/api/webhooks/' not in txt,path
            assert not re.search(r'7656119[0-9]{10}',txt),path
          print('Public files contain no WARCON tokens or Discord webhook URLs')
          PY

name: GOLD page real-data browser review
on:
  push:
    branches: [feature/gold-price-page-20261025]
    paths:
      - 'docs/gold.html'
      - 'docs/js/gold.js'
      - 'docs/js/gold-forecast.js'
      - 'docs/assets/gold.css'
      - 'tests/gold_visual_review.py'
      - '.github/workflows/gold-visual-review.yml'
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'ejronin/1ADAAR' && github.ref == 'refs/heads/feature/gold-price-page-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture screenshots from public current gold data
        run: python tests/gold_visual_review.py
      - name: Upload screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-visual-review
          path: review/gold/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish review screenshots on feature branch only
        run: |
          git config user.name "1adaar-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/gold/desktop-1440.png review/gold/mobile-390.png review/gold/browser-report.json
          if ! git diff --cached --quiet; then
            git commit -m "review: capture real-source GOLD browser screenshots"
            git push origin HEAD:feature/gold-price-page-20261025
          fi
